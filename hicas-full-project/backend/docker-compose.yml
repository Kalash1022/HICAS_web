name: hicas-commerce

services:
  backend:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql://hicas:hicas@postgres:5432/hicas?schema=public
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      S3_ENDPOINT: http://minio:9000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hicas
      POSTGRES_USER: hicas
      POSTGRES_PASSWORD: hicas
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hicas -d hicas']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Development-only bucket initialization. Production bucket/CDN policies are
  # infrastructure-owned and must not be made public by the application.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-hicas}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
