name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hicas
          POSTGRES_USER: hicas
          POSTGRES_PASSWORD: hicas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hicas -d hicas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: 'test'
      PORT: '3000'
      LOG_LEVEL: 'silent'
      DATABASE_URL: 'postgresql://hicas:hicas@localhost:5432/hicas?schema=public'
      DIRECT_URL: 'postgresql://hicas:hicas@localhost:5432/hicas?schema=public'
      FRONTEND_ORIGIN: 'http://localhost:5173'
      TRUST_PROXY_HOPS: '0'
      GOOGLE_CLIENT_ID: 'ci-google-client'
      GOOGLE_CLIENT_SECRET: 'ci-google-client-secret'
      GOOGLE_REDIRECT_URI: 'http://localhost:5173/auth/google/callback'
      OAUTH_TRANSACTION_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      JWT_ACCESS_SECRET: 'ci-only-jwt-access-secret-at-least-32-characters'
      JWT_ACCESS_TTL: '15m'
      REFRESH_TOKEN_TTL_DAYS: '14'
      COOKIE_SECURE: 'false'
      MFA_CHALLENGE_TTL_SECONDS: '300'
      MFA_ENCRYPTION_KEY: '2222222222222222222222222222222222222222222222222222222222222222'
      MAIL_PROVIDER: 'smtp'
      MAIL_FROM: 'no-reply@example.com'
      SMTP_HOST: 'localhost'
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      RATE_LIMIT_STORE: 'memory'
      DEFAULT_SHIPPING_FEE_VND: '30000'
      STORAGE_PROVIDER: 's3'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'hicas-ci'
      S3_ACCESS_KEY: 'ci-access-key'
      S3_SECRET_KEY: 'ci-secret-key'
      RUN_DATABASE_E2E: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply initial migration
        run: npm run prisma:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build
